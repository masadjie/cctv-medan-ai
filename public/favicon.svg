<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Rounded App Icon Background -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" stroke="rgba(255,255,255,0.12)" stroke-width="12"/>

  <!-- Radar Pulse Rings -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="rgba(245, 158, 11, 0.15)" stroke-width="6" stroke-dasharray="16 12"/>
  <circle cx="256" cy="256" r="140" fill="none" stroke="rgba(255, 255, 255, 0.12)" stroke-width="4"/>

  <!-- CCTV Surveillance Camera Body -->
  <g filter="url(#glow)">
    <!-- Main Camera Housing -->
    <rect x="96" y="168" width="220" height="176" rx="36" fill="#27272a" stroke="#ffffff" stroke-width="14"/>
    
    <!-- Camera Lens Hood / Bezel -->
    <polygon points="316,204 424,144 424,368 316,308" fill="#f59e0b" stroke="#ffffff" stroke-width="12" stroke-linejoin="round"/>
    
    <!-- Central AI Optical Lens -->
    <circle cx="206" cy="256" r="54" fill="#09090b" stroke="#ffffff" stroke-width="12"/>
    <circle cx="206" cy="256" r="32" fill="#10b981"/>
    <circle cx="218" cy="244" r="12" fill="#ffffff" opacity="0.8"/>

    <!-- Live Recording Dot -->
    <circle cx="136" cy="204" r="14" fill="#ef4444"/>
  </g>

  <!-- Bottom Accent Line -->
  <path d="M140 430 L372 430" stroke="url(#accentGrad)" stroke-width="16" stroke-linecap="round"/>
</svg>
